# SASRec — no truncation, adaptive token-budget batching.
#
# Verification + adaptive-training test:
#   - No augmentation (shuffle_sessions / random_window both off) — same
#     as baseline, so NDCG for short users should match ~0.197.
#   - max_len=8192: RoPE buffer covers all ML-20M sequences (max=8540).
#     SeqTrainDataset truncates at max_len so effectively no user is trimmed.
#   - token_budget = 256*256 = 65536: BucketBatchSampler scales B = budget/L_pad.
#     neg_emb [B,L,K,d] stays at ~8 GB across all sequence lengths.
#     Short users (L=32): B=2048.  Mid (L=256): B=256.  Long (L=2048): B=32.

seed: 42

model:
  name: sasrec
  d: 256
  n_blocks: 3
  n_heads: 4
  max_len: 8192
  dropout: 0.2
  ffn_mult: 4
  use_rope: true
  use_ligr_gates: false
  use_side: false
  side_use_genome: true
  side_dropout: 0.1

loss:
  name: sampled_softmax
  n_neg: 256
  gbce_t: 0.75
  sampling: uniform
  in_batch_negatives: false

aug:
  sse_pt_p: 0.0
  shuffle_sessions: false
  random_window: false

training:
  batch_size: 256          # used by curriculum path; bucket path uses token_budget
  token_budget: 65536      # B * L_pad = const → neg_emb memory flat at ~8 GB
  eval_batch_size: 1024
  num_workers: 8
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_frac: 0.01
  min_lr_ratio: 1.0
  ema_decay: 0.0
  grad_clip: 1.0
  max_epochs: 100
  eval_every_epochs: 1
  early_stop_patience: 10
  log_every_steps: 200
  snapshot_ensemble: true
  curriculum_warmup_frac: 0.0   # use BucketBatchSampler (not curriculum)

eval:
  ks: [5, 10, 20]
