# SASRec — adaptive token-budget batching, no augmentation.
#
# Verification + adaptive-training test:
#   - No augmentation (shuffle_sessions / random_window both off) — same
#     as baseline, so NDCG should match ~0.197.
#   - token_budget = 256*256 = 65536: BucketBatchSampler scales B = budget/L_pad,
#     keeping neg_emb [B,L,K,d] memory flat across all sequence lengths.
#     Short users (L=32): B=2048.  Mid (L=256): B=256.  ~2× step speedup.
#
# NOTE: max_len=8192 caused OOM because SDPA stores O(L²) attention matrices
# for backward ([8,4,8192,8192]×bf16=4 GB per block × 3 = 12 GB + neg_emb 8 GB
# = 37 GB live). True no-trim requires switching to is_causal=True FlashAttention
# (O(L) memory). max_len=256 until then — adaptive speedup is independent of that.

seed: 42

model:
  name: sasrec
  d: 256
  n_blocks: 3
  n_heads: 4
  max_len: 256
  dropout: 0.2
  ffn_mult: 4
  use_rope: true
  use_ligr_gates: false
  use_side: false
  side_use_genome: true
  side_dropout: 0.1

loss:
  name: sampled_softmax
  n_neg: 256
  gbce_t: 0.75
  sampling: uniform
  in_batch_negatives: false

aug:
  sse_pt_p: 0.0
  shuffle_sessions: false
  random_window: false

training:
  batch_size: 256          # used by curriculum path; bucket path uses token_budget
  token_budget: 16384      # B * L_pad = const → neg_emb memory flat at ~2 GB
  eval_batch_size: 1024
  num_workers: 8
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_frac: 0.01
  min_lr_ratio: 1.0
  ema_decay: 0.0
  grad_clip: 1.0
  max_epochs: 100
  eval_every_epochs: 1
  early_stop_patience: 10
  log_every_steps: 200
  snapshot_ensemble: true
  curriculum_warmup_frac: 0.0   # use BucketBatchSampler (not curriculum)

eval:
  ks: [5, 10, 20]
